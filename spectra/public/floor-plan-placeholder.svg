<svg width="1800" height="1000" viewBox="0 0 1800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1800" height="1000" fill="#070B14"/>
  
  <defs>
    <!-- Grid Pattern -->
    <pattern id="architectural-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131E35" stroke-width="0.8"/>
      <circle cx="40" cy="40" r="1" fill="#1E2E4E" opacity="0.6"/>
    </pattern>
    <pattern id="major-grid" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#1E2F52" stroke-width="1.2" stroke-dasharray="4 4"/>
    </pattern>
    <!-- Gradients -->
    <linearGradient id="building-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A101F" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="lab-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1B33" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#081224" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background Grids -->
  <rect width="1800" height="1000" fill="url(#architectural-grid)"/>
  <rect width="1800" height="1000" fill="url(#major-grid)"/>

  <!-- KORIDOR / JALUR KABEL UTAMA LISTRIK (Glowing Busbar Lines) -->
  <path d="M 480 340 L 680 340 M 1120 340 L 1220 340 M 890 530 L 890 620" stroke="#0284C7" stroke-width="3" stroke-dasharray="6 6" opacity="0.4"/>
  <path d="M 480 340 L 1220 340" stroke="#1E293B" stroke-width="12" stroke-linecap="round" opacity="0.5"/>

  <!-- GEDUNG 1: GEDUNG UTAMA & LAB IT (KIRI) -->
  <g transform="translate(140, 160)">
    <!-- Building Footprint Shadow & Fill -->
    <rect x="0" y="0" width="340" height="380" rx="16" fill="url(#lab-grad)" stroke="#2563EB" stroke-width="1.8" stroke-opacity="0.6"/>
    <!-- Room Partitions -->
    <line x1="0" y1="190" x2="340" y2="190" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="170" y1="190" x2="170" y2="380" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Room Labels -->
    <rect x="18" y="18" width="130" height="24" rx="6" fill="#1E293B" fill-opacity="0.6"/>
    <text x="26" y="34" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1">LAB KOMPUTER 1</text>
    <text x="26" y="225" fill="#64748B" font-family="'Inter', sans-serif" font-size="10" font-weight="600">SERVER ROOM</text>
    <text x="195" y="225" fill="#64748B" font-family="'Inter', sans-serif" font-size="10" font-weight="600">RUANG ROBOTIK</text>
  </g>

  <!-- GEDUNG 2: GEDUNG REKTORAT & KANTOR (TENGAH) -->
  <g transform="translate(680, 140)">
    <rect x="0" y="0" width="440" height="390" rx="16" fill="url(#building-grad)" stroke="#3B82F6" stroke-width="1.8" stroke-opacity="0.5"/>
    <!-- Inner Layout -->
    <line x1="220" y1="0" x2="220" y2="390" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="0" y1="130" x2="440" y2="130" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Room Labels -->
    <rect x="20" y="20" width="140" height="24" rx="6" fill="#1E293B" fill-opacity="0.6"/>
    <text x="28" y="36" fill="#60A5FA" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1">GEDUNG REKTORAT</text>
    <text x="28" y="165" fill="#64748B" font-family="'Inter', sans-serif" font-size="10" font-weight="600">RUANG KEPALA SEKOLAH</text>
    <text x="245" y="165" fill="#64748B" font-family="'Inter', sans-serif" font-size="10" font-weight="600">RUANG TATA USAHA</text>
  </g>

  <!-- GEDUNG 3: AULA & SERBAGUNA (KANAN) -->
  <g transform="translate(1220, 140)">
    <rect x="0" y="0" width="380" height="540" rx="16" fill="url(#building-grad)" stroke="#334155" stroke-width="1.8" stroke-opacity="0.8"/>
    <!-- Stage Area -->
    <path d="M 40 40 L 340 40 L 300 130 L 80 130 Z" fill="#162035" stroke="#1E293B" stroke-width="1.2"/>
    <text x="190" y="90" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">PANGGUNG UTAMA</text>
    <!-- Room Label -->
    <rect x="20" y="500" width="130" height="24" rx="6" fill="#1E293B" fill-opacity="0.6"/>
    <text x="28" y="516" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1">AULA &amp; SARPRAS</text>
  </g>

  <!-- LAPANGAN & AREA TERBUKA -->
  <g transform="translate(420, 640)">
    <rect x="0" y="0" width="680" height="260" rx="20" fill="#0A1220" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="340" cy="130" r="50" fill="none" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="340" y1="0" x2="340" y2="260" stroke="#1E293B" stroke-width="1.5"/>
    <text x="340" y="135" fill="#334155" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">PLAZA UPACARA &amp; OLAHRAGA</text>
  </g>
</svg>
