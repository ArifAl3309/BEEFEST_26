<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E172A" />
      <stop offset="50%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.6" />
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ambientLight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- Squircle Base Container (iOS / Modern macOS style) -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Pattern in background -->
  <g stroke="#1E293B" stroke-width="1.5" opacity="0.35">
    <line x1="128" y1="24" x2="128" y2="488" />
    <line x1="256" y1="24" x2="256" y2="488" />
    <line x1="384" y1="24" x2="384" y2="488" />
    <line x1="24" y1="128" x2="488" y2="128" />
    <line x1="24" y1="256" x2="488" y2="256" />
    <line x1="24" y1="384" x2="488" y2="384" />
  </g>

  <!-- Squircle Border Highlight -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="none" stroke="url(#borderGrad)" stroke-width="3.5" />

  <!-- Ambient Blue/Teal Glow behind Bolt -->
  <circle cx="256" cy="256" r="130" fill="#0284C7" opacity="0.25" filter="url(#ambientLight)" />
  <circle cx="256" cy="240" r="70" fill="#38BDF8" opacity="0.35" filter="url(#neonGlow)" />

  <!-- High-Precision Vector Lightning Bolt (SPECTRA Core Symbol) -->
  <path
    d="M 276 84
       L 172 264
       L 248 264
       L 220 428
       L 344 236
       L 264 236
       Z"
    fill="url(#boltGrad)"
    filter="url(#neonGlow)"
  />

  <!-- Specular Top Rim Reflection -->
  <path
    d="M 276 84 L 172 264 L 210 264 L 282 120 Z"
    fill="#FFFFFF"
    opacity="0.3"
  />

  <!-- Sensor Node Indicator Rings (IoT Sentinel) -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.3" />
  <circle cx="256" cy="256" r="196" fill="none" stroke="#0284C7" stroke-width="1" stroke-dasharray="4 16" opacity="0.2" />

  <!-- Live Pulse Dot in Top Corner -->
  <circle cx="396" cy="116" r="7" fill="#34D399" filter="url(#neonGlow)" />
  <circle cx="396" cy="116" r="14" fill="none" stroke="#34D399" stroke-width="2" opacity="0.4" />
</svg>
